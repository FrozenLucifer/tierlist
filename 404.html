<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рейтинг сравнений — не найдено</title>
  <meta http-equiv="refresh" content="0; url=/">
</head>
<body>
  <p id="redirectMsg">Перенаправление на главную страницу…</p>
  <script>
    const lang = localStorage.getItem('cr_lang') || 'ru';
    const msg = lang === 'en' ? 'Redirecting to main page...' : 'Перенаправление на главную страницу…';
    document.getElementById('redirectMsg').textContent = msg;
    window.location.replace('/');
  </script>
</body>
</html>
